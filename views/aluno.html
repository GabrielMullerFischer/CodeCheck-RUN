<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CodeCheck-C</title>
    <meta name="activity-id" content="{{ACTIVITY_ID}}">
    <meta name="ltik" content="{{LTIK_TOKEN}}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div id="area-aluno">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3 class="text-primary">{{NOME_QUESTAO}}</h3>
                    <p class="text-muted">{{DESCRICAO_QUESTAO}}</p>
                    <div class="alert alert-secondary small">
                        <i class="fas fa-info-circle"></i> <strong>Exemplo:</strong> {{EXEMPLO_QUESTAO}}
                    </div>
                    <hr>
                    <label for="editor">Implemente sua solução em C:</label>
                    <textarea id="editor" class="form-control mb-3" rows="12" style="font-family: monospace;" placeholder="int main() { ... }"></textarea>
                    
                    <div class="clearfix">
                        <button id="btnSubmit" class="btn btn-primary btn-lg px-5 float-right d-flex align-items-center justify-content-center">
                            <i class="fas fa-play mr-2"></i> <span>Compilar</span>
                        </button>
                    </div>
                    
                    <div id="result" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/aluno.js"></script>
</body>
</html>
