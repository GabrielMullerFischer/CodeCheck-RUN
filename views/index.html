<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CodeCheck-C</title>
    <meta name="is-professor" content="{{IS_PROFESSOR_VAL}}">
    <meta name="activity-id" content="{{ACTIVITY_ID}}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <style>
        #area-aluno, #setup-professor { 
            display: none; 
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">

        <div id="area-aluno">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3 class="text-primary">{{NOME_QUESTAO}}</h3>
                    <p class="text-muted">{{DESCRICAO_QUESTAO}}</p>
                    <div class="alert alert-secondary small">
                        <i class="fas fa-info-circle"></i> <strong>Exemplo:</strong> {{EXEMPLO_QUESTAO}}
                    </div>
                    <hr>
                    <label for="editor">Implemente sua solução em C:</label>
                    <textarea id="editor" class="form-control mb-3" rows="12" style="font-family: monospace;" placeholder="int main() { ... }"></textarea>
                    
                    <div class="clearfix">
                        <button id="btnSubmit" class="btn btn-primary btn-lg px-5 float-right">
                            <i class="fas fa-play"></i> Compilar
                        </button>
                    </div>
                    
                    <div id="result" class="mt-4"></div>
                        <button id="btnVoltarConfig" class="btn btn-warning mt-3" style="display: none;">
                            <i class="fas fa-edit"></i> Voltar para Configurações
                        </button>
                </div>
            </div>
        </div>

        <div id="setup-professor" class="card shadow mb-4" style="border: 2px solid #00539b;">
            <div class="card-header text-white" style="background-color: #00539b;">
                <h5 class="mb-0"><i class="fas fa-cogs"></i> CodeCheck-C: Configuração da Atividade</h5>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label class="font-weight-bold">Título da Questão:</label>
                    <input type="text" id="titulo-input" class="form-control" placeholder="Ex: Soma de dois números">
                </div>
                <div class="form-group">
                    <label class="font-weight-bold">Descrição:</label>
                    <textarea id="desc-input" class="form-control" rows="3" placeholder="O que o aluno deve resolver?"></textarea>
                </div>

                <hr>
                <h6><i class="fas fa-vial"></i> Casos de Teste</h6>
                <div id="container-testes">
                    <div class="teste-item border rounded p-3 mb-2 bg-white">
                        <div class="row">
                            <div class="col">
                                <label class="small font-weight-bold">Entradas:</label>
                                <input type="text" class="form-control input-val" placeholder="ex: 10 20">
                            </div>
                            <div class="col">
                                <label class="small font-weight-bold">Saída Esperada:</label>
                                <input type="text" class="form-control output-val" placeholder="ex: 30">
                            </div>
                        </div>
                    </div>
                </div>
                
                <button type="button" id="btnMaisTeste" class="btn btn-outline-info btn-sm mb-4">
                    <i class="fas fa-plus"></i> Adicionar Exemplo
                </button>

                <button id="btnSalvar" class="btn btn-success btn-block btn-lg">
                    Submeter Atividade
                </button>

                <button type="button" id="btnPreview" class="btn btn-outline-primary btn-block mb-2">
                    <i class="fas fa-eye"></i> Testar Atividade
                </button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ltiToken = urlParams.get('ltik');
        const isProfessor = document.querySelector('meta[name="is-professor"]').content === 'true';
        const activityId = document.querySelector('meta[name="activity-id"]').content.trim();

        // Prewier do professor
        function carregarModoPreview() {
            const titulo = document.getElementById('titulo-input').value || "{{NOME_QUESTAO}}";
            const desc = document.getElementById('desc-input').value || "{{DESCRICAO_QUESTAO}}";

            const inputs = document.querySelectorAll('.input-val');
            const outputs = document.querySelectorAll('.output-val');
            let exemploTxt = "{{EXEMPLO_QUESTAO}}";
            
            if (inputs.length > 0 && inputs[0].value.trim() !== "") {
                exemploTxt = `Entrada(s): ${inputs[0].value} | Saída Esperada: ${outputs[0].value}`;
            }

            document.querySelector('#area-aluno h3').innerText = titulo;
            document.querySelector('#area-aluno p').innerText = desc;
            document.querySelector('#area-aluno .alert-secondary strong').nextSibling.textContent = ` ${exemploTxt}`;
            document.getElementById('setup-professor').style.display = 'none';
            document.getElementById('area-aluno').style.display = 'block';
            document.getElementById('btnVoltarConfig').style.display = 'inline-block';
        }

        window.onload = () => {
            const jaConfigurada = !document.getElementById('titulo-input').value.includes("{{") && 
                                   document.getElementById('titulo-input').value !== "";

            if (isProfessor) {
                if (jaConfigurada) {
                    carregarModoPreview();
                } else {
                    document.getElementById('setup-professor').style.display = 'block';
                }
            } else {
                document.getElementById('area-aluno').style.display = 'block';
            }
        };

        document.getElementById('btnPreview').onclick = carregarModoPreview;

        document.getElementById('btnVoltarConfig').onclick = () => {
            document.getElementById('area-aluno').style.display = 'none';
            document.getElementById('setup-professor').style.display = 'block';
        };

        // Lógica de adicionar mais testes
        document.getElementById('btnMaisTeste').onclick = () => {
            const container = document.getElementById('container-testes');
            const div = document.createElement('div');
            div.className = 'teste-item border rounded p-3 pt-4 mb-2 bg-white position-relative shadow-sm';
            div.innerHTML = `
                <button type="button" class="close position-absolute" style="right:10px; top:5px;" onclick="this.parentElement.remove()">
                    <span aria-hidden="true">&times;</span>
                </button>
                <div class="row">
                    <div class="col">
                        <label class="small font-weight-bold">Entradas:</label>
                        <input type="text" class="form-control input-val" placeholder="ex: 10 20">
                    </div>
                    <div class="col">
                        <label class="small font-weight-bold">Saída Esperada:</label>
                        <input type="text" class="form-control output-val" placeholder="ex: 30">
                    </div>
                </div>
            `;
            container.appendChild(div);
        };

        // Lógica de salvar do Professor
        document.getElementById('btnSalvar').onclick = async () => {
            const btn = document.getElementById('btnSalvar');
            const activityId = document.querySelector('meta[name="activity-id"]').content.trim();

            btn.disabled = true;
            btn.innerText = "Salvando...";

            const itens = document.querySelectorAll('.teste-item');
            const testesArray = [];
            itens.forEach(item => {
                const input = item.querySelector('.input-val').value.trim();
                const output = item.querySelector('.output-val').value.trim();
                if (input !== "" || output !== "") {
                    testesArray.push({ input, output });
                }
            });

            const dados = {
                title: document.getElementById('titulo-input').value,
                description: document.getElementById('desc-input').value,
                tests: JSON.stringify(testesArray),
                activityId: activityId, 
                isProfessor: 'true' 
            };

            try {
                const url = '/judge/setup' + (ltiToken ? `?ltik=${ltiToken}` : '');
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    alert("Configuração salva com sucesso!");
                    location.reload();
                } else {
                    alert("Erro ao salvar: " + (result.error || "Unauthorized"));
                }
            } catch (err) {
                alert("Erro de conexão ao salvar.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Submeter Atividade";
            }
        };

        // Lógica de submissão do aluno
        document.getElementById('btnSubmit').onclick = async () => {
            const resultDiv = document.getElementById('result');
            const code = document.getElementById('editor').value;

            const activityId = document.querySelector('meta[name="activity-id"]').content.trim();

            if (activityId !== "" && !activityId.includes("{{")) {
                resultDiv.innerHTML = '<div class="alert alert-info"><i class="fas fa-spinner fa-spin"></i> Aguardando correção...</div>';

                try {
                    const url = '/judge/submit' + (ltiToken ? `?ltik=${ltiToken}` : '');
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, activityId })
                    });

                    const data = await res.json();
                    
                    if (res.ok) {
                        let cor = data.status === 'Accepted' ? 'success' : 'danger';
                        resultDiv.innerHTML = `<div class="alert alert-${cor} shadow-sm">
                            <strong>Resultado:</strong> ${data.status}
                        </div>`;
                    } else {
                        resultDiv.innerHTML = `<div class="alert alert-warning">Erro ${res.status}: Sessão expirada ou erro no servidor.</div>`;
                    }
                } catch (err) {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Erro de conexão com o servidor.</div>`;
                }
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">Erro crítico: O ID (${activityId}) não foi carregado corretamente pelo servidor.</div>`;
            }
        };
    </script>
</body>
</html>
