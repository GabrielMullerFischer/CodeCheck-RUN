# ==============================================================================
# CodeCheck-RUN — Manifesto Single-Node / Local (1 Nó ou Windows Docker Desktop)
# ==============================================================================
# Utiliza imagens locais (codecheck-app:latest e gcc:latest com IfNotPresent),
# sem depender de Container Registry externo (localhost:32000) nem de outros nós.
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: codecheck
  labels:
    app.kubernetes.io/name: codecheck
    app.kubernetes.io/part-of: codecheck-platform
    environment: standalone
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codecheck-sa
  namespace: codecheck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codecheck-pod-manager-role
  namespace: codecheck
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "pods/exec"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codecheck-pod-manager-binding
  namespace: codecheck
subjects:
  - kind: ServiceAccount
    name: codecheck-sa
    namespace: codecheck
roleRef:
  kind: Role
  name: codecheck-pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: codecheck-quota
  namespace: codecheck
spec:
  hard:
    pods: "9"
    requests.cpu: "9"
    requests.memory: "5Gi"
    limits.cpu: "10"
    limits.memory: "9Gi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-judge-sandbox
  namespace: codecheck
spec:
  podSelector:
    matchLabels:
      role: judge-sandbox
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-codecheck-backend
  namespace: codecheck
spec:
  podSelector:
    matchLabels:
      app: codecheck-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
  egress:
    - {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codecheck-app
  namespace: codecheck
  labels:
    app: codecheck-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codecheck-app
  template:
    metadata:
      labels:
        app: codecheck-app
    spec:
      serviceAccountName: codecheck-sa
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.15.113.1
          - 8.8.8.8
          - 1.1.1.1
      containers:
        - name: codecheck-server
          image: codecheck-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: lti
          envFrom:
            - secretRef:
                name: codecheck-env
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: codecheck-service
  namespace: codecheck
  labels:
    app: codecheck-app
spec:
  type: NodePort
  selector:
    app: codecheck-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
    - name: lti
      port: 3001
      targetPort: 3001
      nodePort: 30001
