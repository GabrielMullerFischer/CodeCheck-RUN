apiVersion: v1
kind: ServiceAccount
metadata:
  name: codecheck-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codecheck-pod-manager-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codecheck-pod-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: codecheck-sa
    namespace: default
roleRef:
  kind: Role
  name: codecheck-pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codecheck-app
  namespace: default
  labels:
    app: codecheck-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codecheck-app
  template:
    metadata:
      labels:
        app: codecheck-app
    spec:
      serviceAccountName: codecheck-sa
      containers:
        - name: codecheck-server
          image: codecheck-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: lti
          envFrom:
            - secretRef:
                name: codecheck-env
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: codecheck-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: codecheck-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
    - name: lti
      port: 3001
      targetPort: 3001
      nodePort: 30001